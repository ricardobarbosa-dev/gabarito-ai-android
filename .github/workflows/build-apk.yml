name: Build GabaritoAI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (v8.4)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          # If project was pushed inside a subfolder, locate build.gradle
          if [ ! -f "build.gradle" ] && [ -d "gabarito-ai-android" ] && [ -f "gabarito-ai-android/build.gradle" ]; then
            echo "Moving into subfolder: gabarito-ai-android"
            cd gabarito-ai-android
          fi

          echo "Current working directory files:"
          ls -la

          # Build using gradlew if present or fallback to gradle CLI
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found at root, running gradle CLI..."
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK File for Distribution
        run: |
          # Locate built APK and copy to root as GabaritoAI.apk
          APK_PATH=$(find . -name "app-debug.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./GabaritoAI.apk
            echo "GabaritoAI.apk prepared at root. Size: $(ls -lh ./GabaritoAI.apk | awk '{print $5}')"
          else
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GabaritoAI-Debug-APK
          path: GabaritoAI.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: GabaritoAI Mobile v1.0.0 (APK Direto)
          body: |
            ### 📱 GabaritoAI Mobile - Download Direto do APK
            Toque no link **GabaritoAI.apk** abaixo para baixar e instalar diretamente sem precisar descompactar zip!
            
            **Dica de Instalação no Android / Xiaomi:**
            - Se aparecer aviso do Play Protect: toque em **"Mais detalhes"** > **"Instalar assim mesmo"**.
            - Permita instalação de fontes desconhecidas para o seu navegador ou gerenciador de arquivos.
          files: GabaritoAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
