name: Build GabaritoAI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (v8.4)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          # If project was pushed inside a subfolder, locate build.gradle
          if [ ! -f "build.gradle" ] && [ -d "gabarito-ai-android" ] && [ -f "gabarito-ai-android/build.gradle" ]; then
            echo "Moving into subfolder: gabarito-ai-android"
            cd gabarito-ai-android
          fi

          echo "Current working directory files:"
          ls -la

          # Build using gradlew if present or fallback to gradle CLI
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found at root, running gradle CLI..."
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK Generation
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GabaritoAI-Debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
